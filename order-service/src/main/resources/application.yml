spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders_incremental}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

erp:
  client:
    base-url: ${ERP_BASE_URL:http://localhost:8081}
    connect-timeout: ${ERP_CONNECT_TIMEOUT:2s}
    read-timeout: ${ERP_READ_TIMEOUT:3s}

orders:
  processing:
    scheduling-enabled: ${ORDER_PROCESSING_SCHEDULING_ENABLED:true}
    fixed-delay: ${ORDER_PROCESSING_FIXED_DELAY:60000}
    initial-delay: ${ORDER_PROCESSING_INITIAL_DELAY:60000}
